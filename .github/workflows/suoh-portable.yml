name: iMessage Exporter Desktop Suoh Edition (portable)

on:
  push:
    branches: [main]
    paths: ['portable/**', '.github/workflows/suoh-portable.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suoh-portable
  cancel-in-progress: true

env:
  SUOH_VERSION: 0.2.3
  SUOH_PRODUCT_NAME: iMessage Exporter Desktop Suoh Edition
  SUOH_PACKAGE_NAME: imessage-exporter-desktop-suoh-edition
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
  PUBLISH_RELEASE: 'true'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned engine identity
        run: |
          $engine = Get-Content portable/engine-source.json -Raw | ConvertFrom-Json
          "ENGINE_COMMIT=$($engine.source_commit)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_TREE=$($engine.source_tree)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_VERSION=$($engine.engine_version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_BASE_RELEASE=$($engine.base_release)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Independent model tests
        run: |
          dotnet run --project portable/Suoh.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Model tests failed' }
      - name: Build new WPF application
        run: |
          powershell -NoProfile -STA -File portable/scripts/Icon.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Icon build failed' }
          dotnet publish portable/Suoh.App -c Release -r win-x64 --self-contained true -o build/app -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'WPF build failed' }
      - name: Real native-window and WPF layout checks
        run: |
          New-Item -ItemType Directory -Force build/ui | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE 'build/ui'
          $exe = Join-Path 'build/app' "$($env:SUOH_PRODUCT_NAME).exe"
          $app = Start-Process -FilePath $exe -ArgumentList @('--ui-test', ('"{0}"' -f $report)) -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'UI verification timed out' }
          if ($app.ExitCode -ne 0) {
            Get-Content build/ui/ui-failure.txt -ErrorAction SilentlyContinue
            throw "UI verification failed: $($app.ExitCode)"
          }
          Get-Content build/ui/ui-checks.json
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imessage-exporter-desktop-suoh-edition-UI-evidence
          path: build/ui/
          if-no-files-found: warn
          retention-days: 14
      - name: Fetch original ReagentX source
        run: |
          git init engine-source
          git -C engine-source config core.autocrlf false
          git -C engine-source remote add origin https://github.com/ReagentX/imessage-exporter.git
          git -C engine-source fetch --depth 1 origin $env:ENGINE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed' }
          git -C engine-source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Upstream checkout failed' }
          $commit = git -C engine-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:ENGINE_COMMIT) { throw 'Upstream commit mismatch' }
          $tree = git -C engine-source rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree -cne $env:ENGINE_TREE) { throw 'Source does not match the verified uploaded snapshot' }
          git -C engine-source apply "$env:GITHUB_WORKSPACE/portable/patches/suoh-password.patch"
          if ($LASTEXITCODE -ne 0) { throw 'GUI password bridge patch failed' }
          python portable/scripts/prepare_engine.py engine-source
          if ($LASTEXITCODE -ne 0) { throw 'Engine version preparation failed' }
          git -C engine-source diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Upstream patch validation failed' }
      - name: Rust toolchain
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine-source/target
          key: suoh-static-v1-${{ runner.os }}-${{ hashFiles('engine-source/Cargo.lock') }}
          restore-keys: suoh-static-v1-${{ runner.os }}-
      - name: Test and compile original export engine
        run: |
          # Upstream timestamp snapshots assume Pacific time. This affects this disposable runner only.
          Set-TimeZone -Id 'Pacific Standard Time'
          # This upstream path-test prefix matches two tests; its POSIX separator assertion differs on Windows.
          cargo test --locked --target x86_64-pc-windows-msvc --manifest-path engine-source/Cargo.toml --workspace -- --skip app::runtime::directory_tests::can_get_path_copied
          if ($LASTEXITCODE -ne 0) { throw 'Upstream tests failed' }
          cargo build --locked --target x86_64-pc-windows-msvc --release --manifest-path engine-source/Cargo.toml --package imessage-exporter
          if ($LASTEXITCODE -ne 0) { throw 'Upstream build failed' }
          & engine-source/target/x86_64-pc-windows-msvc/release/imessage-exporter.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Engine smoke test failed' }
          python portable/scripts/verify_engine.py engine-source/target/x86_64-pc-windows-msvc/release/imessage-exporter.exe engine-source/imessage-database/test_data/db/test.db build/engine-checks
          if ($LASTEXITCODE -ne 0) { throw 'Portable dependency/export checks failed' }
      - name: Assemble portable package and corresponding source
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE "build/$env:SUOH_PRODUCT_NAME"
          New-Item -ItemType Directory -Force "$portable/engine", "$portable/licenses", 'build/dist', 'build/source' | Out-Null
          Copy-Item build/app/* $portable -Recurse
          Copy-Item engine-source/target/x86_64-pc-windows-msvc/release/imessage-exporter.exe "$portable/engine/"
          Copy-Item portable/engine-source.json "$portable/engine/engine-source.json"
          Copy-Item portable/README.md "$portable/README.md"
          Copy-Item portable/THIRD-PARTY.md "$portable/licenses/THIRD-PARTY.md"
          Copy-Item engine-source/LICENSE "$portable/licenses/UPSTREAM-GPL-3.0.txt"
          Copy-Item LICENSE "$portable/licenses/SUOH-GPL-3.0.txt"
          $dotnetDir = Split-Path (Get-Command dotnet).Source
          foreach ($license in @('LICENSE.txt', 'ThirdPartyNotices.txt')) {
            if (Test-Path "$dotnetDir/$license") { Copy-Item "$dotnetDir/$license" "$portable/licenses/DOTNET-$license" }
          }
          @("$env:SUOH_PRODUCT_NAME $env:SUOH_VERSION", "Namespace: IMessageExporterDesktopSuohEdition", "Desktop: $env:GITHUB_SHA", "Engine version: $env:ENGINE_VERSION", "Upstream base release: $env:ENGINE_BASE_RELEASE; includes later develop fixes from the user-supplied snapshot", "Original engine: ReagentX/imessage-exporter@$env:ENGINE_COMMIT", "Source tree: $env:ENGINE_TREE", "Build: Windows x64, self-contained .NET 10", "Patch: portable/patches/suoh-password.patch", "Version preparation: portable/scripts/prepare_engine.py") | Set-Content "$portable/BUILD-INFO.txt" -Encoding utf8
          Compress-Archive -Path $portable -DestinationPath "build/dist/$env:SUOH_PACKAGE_NAME-$env:SUOH_VERSION-win-x64-portable.zip"
          git archive --format=zip --output build/source-desktop.zip HEAD portable .github/workflows/suoh-portable.yml
          if ($LASTEXITCODE -ne 0) { throw 'Desktop source archive failed' }
          Expand-Archive build/source-desktop.zip build/source/desktop
          Copy-Item LICENSE build/source/desktop/LICENSE
          git -C engine-source archive --format=zip --output "$env:GITHUB_WORKSPACE/build/source-engine.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Engine source archive failed' }
          Expand-Archive build/source-engine.zip build/source/engine-original
          Copy-Item portable/BUILD.md build/source/BUILD.md
          Compress-Archive -Path build/source/* -DestinationPath "build/dist/$env:SUOH_PACKAGE_NAME-$env:SUOH_VERSION-source.zip"
          Get-ChildItem build/dist -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content build/dist/SHA256SUMS.txt -Encoding ascii
      - name: Verify extracted renamed portable package
        run: |
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'build/portable extraction'
          $report = Join-Path $env:GITHUB_WORKSPACE 'build/portable launch checks'
          Expand-Archive -LiteralPath "build/dist/$env:SUOH_PACKAGE_NAME-$env:SUOH_VERSION-win-x64-portable.zip" -DestinationPath $extracted
          $roots = @(Get-ChildItem -LiteralPath $extracted)
          if ($roots.Count -ne 1 -or $roots[0].Name -cne $env:SUOH_PRODUCT_NAME -or -not $roots[0].PSIsContainer) { throw 'Portable folder name mismatch' }
          $folder = $roots[0].FullName
          $exe = Join-Path $folder "$($env:SUOH_PRODUCT_NAME).exe"
          $engine = [System.IO.Path]::Combine($folder, 'engine', 'imessage-exporter.exe')
          if (-not (Test-Path -LiteralPath $exe) -or -not (Test-Path -LiteralPath $engine)) { throw 'Portable executable or engine missing' }
          $engineIdentity = Get-Content -LiteralPath (Join-Path $folder 'engine/engine-source.json') -Raw | ConvertFrom-Json
          if ($engineIdentity.source_commit -cne $env:ENGINE_COMMIT -or $engineIdentity.engine_version -cne $env:ENGINE_VERSION) { throw 'Packaged engine identity mismatch' }
          $executables = @(Get-ChildItem -LiteralPath $folder -File -Filter '*.exe')
          if ($executables.Count -ne 1 -or $executables[0].Name -cne "$($env:SUOH_PRODUCT_NAME).exe") { throw 'Unexpected old executable in portable root' }
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($metadata.ProductName -cne $env:SUOH_PRODUCT_NAME -or $metadata.FileDescription -cne $env:SUOH_PRODUCT_NAME) { throw 'Windows file properties have the wrong product name' }
          # Different working directory and spaces in both the executable and report paths.
          $app = Start-Process -FilePath $exe -WorkingDirectory $extracted -ArgumentList @('--ui-test', ('"{0}"' -f $report)) -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged UI verification timed out' }
          if ($app.ExitCode -ne 0) {
            Get-Content -LiteralPath (Join-Path $report 'ui-failure.txt') -ErrorAction SilentlyContinue
            throw "Packaged UI verification failed: $($app.ExitCode)"
          }
          $checks = Get-Content -LiteralPath (Join-Path $report 'ui-checks.json') -Raw | ConvertFrom-Json
          $identity = $checks | Where-Object check -eq 'edition-identity'
          if ($identity.engine -cne $engine) { throw 'GUI engine lookup is not relative to the renamed portable folder' }
          python portable/scripts/verify_engine.py $engine engine-source/imessage-database/test_data/db/test.db 'build/packaged-engine-checks'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted engine export checks failed' }
          Get-Content -LiteralPath (Join-Path $report 'ui-checks.json')
      - name: Upload packaged launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imessage-exporter-desktop-suoh-edition-package-evidence
          path: |
            build/portable launch checks/
            build/packaged-engine-checks/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload portable deliverables
        uses: actions/upload-artifact@v4
        with:
          name: imessage-exporter-desktop-suoh-edition-${{ env.SUOH_VERSION }}-win-x64
          path: build/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish new portable release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SUOH_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Existing release preserved. Bump SUOH_VERSION before publishing another binary.'
            exit 0
          }
          $files = Get-ChildItem build/dist -File | ForEach-Object FullName
          gh release create $tag @files --target $env:GITHUB_SHA --title "$env:SUOH_PRODUCT_NAME $env:SUOH_VERSION" --notes-file portable/RELEASE.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
